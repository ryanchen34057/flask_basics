<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS 印表機控制台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pos_styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>POS 印表機控制台</h1>

        <!-- 列印模式選擇 -->
        <div class="section">
            <h2>列印模式</h2>
            <div class="mode-selector">
                <label class="mode-option">
                    <input type="radio" name="print-mode" value="adb" checked onchange="switchMode()">
                    <span class="mode-label">ADB 模式（推薦 Sunmi T2）</span>
                    <span class="mode-desc">透過 ADB over WiFi 直接控制 Sunmi 內建印表機。首次需 USB 線設定一次，之後永久免線。</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="print-mode" value="queue" onchange="switchMode()">
                    <span class="mode-label">佇列模式</span>
                    <span class="mode-desc">Sunmi 瀏覽器開著接收端頁面，自動接收列印任務</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="print-mode" value="network" onchange="switchMode()">
                    <span class="mode-label">網路印表機模式</span>
                    <span class="mode-desc">透過 TCP (port 9100) 連線到網路印表機</span>
                </label>
            </div>

            <!-- ADB 模式設定 -->
            <div id="adb-settings">
                <div class="form-row">
                    <label for="adb-ip">Sunmi IP：</label>
                    <input type="text" id="adb-ip" placeholder="192.168.1.118" value="192.168.1.118">
                </div>
                <div class="form-row">
                    <label for="adb-port">ADB Port：</label>
                    <input type="number" id="adb-port" value="5555" min="1" max="65535">
                </div>
                <button class="btn btn-secondary" onclick="adbTest()">測試 ADB 連線</button>
                <button class="btn btn-secondary" onclick="adbSetup()">首次 USB 設定</button>
                <span id="adb-status"></span>
                <div class="sunmi-status" style="margin-top:10px;">
                    <strong>首次設定步驟：</strong><br>
                    1. 用 USB 線連接 Sunmi 和電腦<br>
                    2. Sunmi 上點「允許 USB 偵錯」<br>
                    3. 按上面的「首次 USB 設定」按鈕<br>
                    4. 成功後拔掉 USB 線，之後永久透過 WiFi 列印
                </div>
            </div>

            <!-- 佇列模式提示 -->
            <div id="queue-status" class="sunmi-status" style="display:none;">
                <strong>使用方式：</strong><br>
                1. 在 Sunmi POS 機的瀏覽器開啟：<code id="receiver-url"></code><br>
                2. 確認接收端顯示「接收中...」<br>
                3. 在這裡填寫內容，按列印即可<br>
                <br>
                <span>佇列狀態：<span id="queue-count">0</span> 個任務等待中</span>
            </div>

            <!-- 網路印表機設定 (僅網路模式顯示) -->
            <div id="network-settings" style="display:none;">
                <div class="form-row">
                    <label for="printer-ip">印表機 IP：</label>
                    <input type="text" id="printer-ip" placeholder="192.168.1.100" value="192.168.1.100">
                </div>
                <div class="form-row">
                    <label for="printer-port">Port：</label>
                    <input type="number" id="printer-port" value="9100" min="1" max="65535">
                </div>
                <button class="btn btn-secondary" onclick="testConnection()">測試連線</button>
                <span id="connection-status"></span>
            </div>
        </div>

        <!-- 模式切換 -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('receipt')">收據列印</button>
            <button class="tab" onclick="switchTab('text')">純文字列印</button>
        </div>

        <!-- 收據列印 -->
        <div id="tab-receipt" class="tab-content active">
            <div class="section">
                <h2>收據內容</h2>
                <div class="form-row">
                    <label for="store-name">店名：</label>
                    <input type="text" id="store-name" placeholder="我的商店" value="我的商店">
                </div>

                <h3>商品明細</h3>
                <div id="items-list">
                    <div class="item-row">
                        <input type="text" class="item-name" placeholder="品名">
                        <input type="number" class="item-qty" placeholder="數量" value="1" min="1">
                        <input type="number" class="item-price" placeholder="單價" value="0" min="0">
                        <button class="btn btn-danger btn-small" onclick="removeItem(this)">刪除</button>
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="addItem()">+ 新增商品</button>

                <div class="form-row total-row">
                    <label>總計：</label>
                    <span id="total-amount">$0</span>
                    <button class="btn btn-secondary btn-small" onclick="calculateTotal()">重新計算</button>
                </div>

                <div class="form-row">
                    <label for="note">備註：</label>
                    <textarea id="note" rows="2" placeholder="選填備註..."></textarea>
                </div>

                <button class="btn btn-primary" onclick="printReceipt()">列印收據</button>
            </div>
        </div>

        <!-- 純文字列印 -->
        <div id="tab-text" class="tab-content">
            <div class="section">
                <h2>純文字列印</h2>
                <div class="form-row">
                    <label for="text-content">列印內容：</label>
                    <textarea id="text-content" rows="8" placeholder="輸入要列印的文字..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="printText()">列印文字</button>
            </div>
        </div>

        <!-- 結果訊息 -->
        <div id="result-message" class="result-message hidden"></div>

        <!-- 列印預覽 -->
        <div class="section">
            <h2>收據預覽</h2>
            <div id="receipt-preview" class="receipt-preview">
                <p class="preview-placeholder">填入資料後會顯示預覽</p>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // Sunmi JS Bridge 偵測與操作
        // ============================================================
        const SunmiPrinter = {
            available: false,
            bridge: null,

            detect: function() {
                // Sunmi 設備的 WebView 會注入這些 JavaScript 介面
                if (typeof AndroidBridge !== 'undefined') {
                    this.bridge = AndroidBridge;
                    this.available = true;
                } else if (typeof android !== 'undefined' && android.printText) {
                    this.bridge = android;
                    this.available = true;
                } else if (typeof SunmiInnerPrinter !== 'undefined') {
                    this.bridge = SunmiInnerPrinter;
                    this.available = true;
                } else if (typeof window.PrinterPlugin !== 'undefined') {
                    this.bridge = window.PrinterPlugin;
                    this.available = true;
                }

                // 檢查 User Agent 判斷是否為 Sunmi 設備
                const ua = navigator.userAgent.toLowerCase();
                this.isSunmiDevice = ua.includes('sunmi');

                return this.available;
            },

            // 透過 JS Bridge 列印文字
            printText: function(text) {
                if (this.bridge) {
                    try {
                        if (this.bridge.printText) {
                            this.bridge.printText(text + '\n', null);
                        } else if (this.bridge.print) {
                            this.bridge.print(text);
                        }
                        return true;
                    } catch(e) {
                        console.error('Sunmi printText error:', e);
                        return false;
                    }
                }
                return false;
            },

            // 設定對齊
            setAlign: function(align) {
                // 0=左, 1=中, 2=右
                if (this.bridge && this.bridge.setAlignment) {
                    try { this.bridge.setAlignment(align, null); } catch(e) {}
                }
            },

            // 設定字體大小
            setFontSize: function(size) {
                if (this.bridge && this.bridge.setFontSize) {
                    try { this.bridge.setFontSize(size, null); } catch(e) {}
                }
            },

            // 粗體
            setBold: function(on) {
                if (this.bridge && this.bridge.sendRAWData) {
                    try {
                        const cmd = on ? 'G0E01' : 'G0E00';  // ESC E 1/0
                        this.bridge.sendRAWData(cmd, null);
                    } catch(e) {}
                }
            },

            // 走紙
            lineWrap: function(lines) {
                if (this.bridge && this.bridge.lineWrap) {
                    try { this.bridge.lineWrap(lines, null); } catch(e) {}
                }
            },

            // 切紙
            cutPaper: function() {
                if (this.bridge && this.bridge.cutPaper) {
                    try { this.bridge.cutPaper(null); } catch(e) {}
                }
            }
        };

        // ============================================================
        // 模式控制
        // ============================================================
        function getMode() {
            return document.querySelector('input[name="print-mode"]:checked').value;
        }

        function switchMode() {
            const mode = getMode();
            document.getElementById('adb-settings').style.display = mode === 'adb' ? 'block' : 'none';
            document.getElementById('network-settings').style.display = mode === 'network' ? 'block' : 'none';
            document.getElementById('queue-status').style.display = mode === 'queue' ? 'block' : 'none';
        }

        // ============================================================
        // 通用 UI 函式
        // ============================================================
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.target.classList.add('active');
        }

        function addItem() {
            const list = document.getElementById('items-list');
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <input type="text" class="item-name" placeholder="品名">
                <input type="number" class="item-qty" placeholder="數量" value="1" min="1">
                <input type="number" class="item-price" placeholder="單價" value="0" min="0">
                <button class="btn btn-danger btn-small" onclick="removeItem(this)">刪除</button>
            `;
            list.appendChild(row);
        }

        function removeItem(btn) {
            const rows = document.querySelectorAll('.item-row');
            if (rows.length > 1) {
                btn.parentElement.remove();
                calculateTotal();
            }
        }

        function getItems() {
            const items = [];
            document.querySelectorAll('.item-row').forEach(row => {
                const name = row.querySelector('.item-name').value.trim();
                const qty = parseInt(row.querySelector('.item-qty').value) || 0;
                const price = parseInt(row.querySelector('.item-price').value) || 0;
                if (name) {
                    items.push({ name, qty, price });
                }
            });
            return items;
        }

        function calculateTotal() {
            const items = getItems();
            let total = 0;
            items.forEach(item => { total += item.qty * item.price; });
            document.getElementById('total-amount').textContent = '$' + total;
            updatePreview();
            return total;
        }

        function updatePreview() {
            const storeName = document.getElementById('store-name').value || '我的商店';
            const items = getItems();
            const total = items.reduce((sum, item) => sum + item.qty * item.price, 0);
            const note = document.getElementById('note').value;

            let html = `<div class="preview-store">${storeName}</div>`;
            html += '<div class="preview-separator">================================</div>';

            if (items.length === 0) {
                html += '<div class="preview-line">(尚未新增商品)</div>';
            } else {
                items.forEach(item => {
                    const lineTotal = item.qty * item.price;
                    html += `<div class="preview-line">${item.name}</div>`;
                    html += `<div class="preview-detail">  ${item.qty} x $${item.price}<span class="preview-right">$${lineTotal}</span></div>`;
                });
            }

            html += '<div class="preview-separator">================================</div>';
            html += `<div class="preview-total">總計: $${total}</div>`;

            if (note) {
                html += '<div class="preview-separator">--------------------------------</div>';
                html += `<div class="preview-line">備註: ${note}</div>`;
            }

            html += '<div class="preview-footer">謝謝光臨！</div>';
            document.getElementById('receipt-preview').innerHTML = html;
        }

        document.addEventListener('input', function(e) {
            if (e.target.closest('#tab-receipt')) {
                calculateTotal();
            }
        });

        function showResult(success, message) {
            const el = document.getElementById('result-message');
            el.textContent = message;
            el.className = 'result-message ' + (success ? 'success' : 'error');
            setTimeout(() => { el.className = 'result-message hidden'; }, 5000);
        }

        // ============================================================
        // 建立收據純文字（給 Sunmi 模式用）
        // ============================================================
        function buildReceiptText(storeName, items, total, note) {
            const W = 32; // 熱感應紙通常 32 字元寬
            let lines = [];

            // 店名
            lines.push(storeName);
            lines.push('');
            lines.push('='.repeat(W));

            // 商品
            items.forEach(item => {
                const lineTotal = item.qty * item.price;
                lines.push(item.name);
                const detail = `  ${item.qty} x $${item.price}`;
                const totalStr = `$${lineTotal}`;
                const spaces = Math.max(1, W - detail.length - totalStr.length);
                lines.push(detail + ' '.repeat(spaces) + totalStr);
            });

            lines.push('='.repeat(W));

            // 總計
            const totalStr = `總計: $${total}`;
            lines.push(' '.repeat(Math.max(0, W - totalStr.length)) + totalStr);
            lines.push('');

            // 備註
            if (note) {
                lines.push('-'.repeat(W));
                lines.push(`備註: ${note}`);
            }

            lines.push('');
            lines.push('        謝謝光臨！');
            lines.push('');

            return lines.join('\n');
        }

        // ============================================================
        // Sunmi 模式列印
        // ============================================================
        function sunmiPrintReceipt() {
            const items = getItems();
            const total = calculateTotal();

            if (items.length === 0) {
                showResult(false, '請至少新增一項商品');
                return;
            }

            const storeName = document.getElementById('store-name').value || '我的商店';
            const note = document.getElementById('note').value;

            // 透過 Flask 後端產生 ESC/POS 格式，由前端呼叫 Sunmi Bridge 送出
            const payload = {
                store_name: storeName,
                items: items,
                total: total,
                note: note
            };

            fetch('/pos/sunmi/receipt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // 嘗試用 JS Bridge 列印
                    if (SunmiPrinter.available) {
                        SunmiPrinter.printText(data.text);
                        SunmiPrinter.lineWrap(4);
                        SunmiPrinter.cutPaper();
                        showResult(true, '已透過 Sunmi Bridge 送出列印！');
                    } else {
                        // 沒有 JS Bridge，嘗試用 Sunmi 的 HTTP 本機列印服務
                        sunmiFallbackPrint(data.text);
                    }
                } else {
                    showResult(false, data.message);
                }
            })
            .catch(e => showResult(false, '請求失敗：' + e.message));
        }

        function sunmiPrintText() {
            const content = document.getElementById('text-content').value;
            if (!content.trim()) {
                showResult(false, '請輸入列印內容');
                return;
            }

            if (SunmiPrinter.available) {
                SunmiPrinter.printText(content);
                SunmiPrinter.lineWrap(4);
                SunmiPrinter.cutPaper();
                showResult(true, '已透過 Sunmi Bridge 送出列印！');
            } else {
                sunmiFallbackPrint(content);
            }
        }

        // Sunmi 本機 HTTP 列印服務 fallback
        function sunmiFallbackPrint(text) {
            // 嘗試呼叫 Sunmi 本機的 HTTP 列印介面 (部分 Sunmi 韌體支援)
            fetch('http://localhost:18989/print', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text }),
                mode: 'no-cors'
            })
            .then(() => {
                showResult(true, '已送出列印請求（透過本機列印服務）');
            })
            .catch(() => {
                // 最後 fallback：透過 Flask 後端用 TCP 嘗試
                showResult(false,
                    '找不到 Sunmi JS Bridge。請確認：\n' +
                    '1. 此頁面是在 Sunmi POS 機的瀏覽器上開啟\n' +
                    '2. 或切換到「網路印表機模式」使用 TCP 連線'
                );
            });
        }

        // ============================================================
        // 網路模式列印 (原有的 TCP 方式)
        // ============================================================
        function getPrinterConfig() {
            return {
                host: document.getElementById('printer-ip').value.trim(),
                port: parseInt(document.getElementById('printer-port').value) || 9100
            };
        }

        async function testConnection() {
            const config = getPrinterConfig();
            const status = document.getElementById('connection-status');
            status.textContent = '測試中...';
            status.className = '';

            try {
                const res = await fetch('/pos/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                const data = await res.json();
                status.textContent = data.message;
                status.className = data.success ? 'status-ok' : 'status-err';
            } catch (e) {
                status.textContent = '請求失敗：' + e.message;
                status.className = 'status-err';
            }
        }

        async function networkPrintReceipt() {
            const config = getPrinterConfig();
            const items = getItems();
            const total = calculateTotal();

            if (!config.host) { showResult(false, '請輸入印表機 IP'); return; }
            if (items.length === 0) { showResult(false, '請至少新增一項商品'); return; }

            const payload = {
                host: config.host,
                port: config.port,
                store_name: document.getElementById('store-name').value || '我的商店',
                items: items,
                total: total,
                note: document.getElementById('note').value
            };

            try {
                const res = await fetch('/pos/print_receipt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                showResult(data.success, data.message);
            } catch (e) {
                showResult(false, '請求失敗：' + e.message);
            }
        }

        async function networkPrintText() {
            const config = getPrinterConfig();
            const content = document.getElementById('text-content').value;

            if (!config.host) { showResult(false, '請輸入印表機 IP'); return; }
            if (!content.trim()) { showResult(false, '請輸入列印內容'); return; }

            try {
                const res = await fetch('/pos/print_text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        host: config.host,
                        port: config.port,
                        content: content
                    })
                });
                const data = await res.json();
                showResult(data.success, data.message);
            } catch (e) {
                showResult(false, '請求失敗：' + e.message);
            }
        }

        // ============================================================
        // ADB 模式
        // ============================================================
        function getAdbConfig() {
            return {
                host: document.getElementById('adb-ip').value.trim(),
                port: parseInt(document.getElementById('adb-port').value) || 5555
            };
        }

        async function adbTest() {
            const config = getAdbConfig();
            const status = document.getElementById('adb-status');
            status.textContent = '測試中...';
            status.className = '';

            try {
                const res = await fetch('/pos/adb/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                const data = await res.json();
                status.textContent = data.message;
                status.className = data.success ? 'status-ok' : 'status-err';
            } catch (e) {
                status.textContent = '請求失敗：' + e.message;
                status.className = 'status-err';
            }
        }

        async function adbSetup() {
            const config = getAdbConfig();
            const status = document.getElementById('adb-status');
            status.textContent = '設定中...請確認 USB 已連接';
            status.className = '';

            try {
                const res = await fetch('/pos/adb/setup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                const data = await res.json();
                status.textContent = data.message;
                status.className = data.success ? 'status-ok' : 'status-err';
            } catch (e) {
                status.textContent = '請求失敗：' + e.message;
                status.className = 'status-err';
            }
        }

        async function adbPrintReceipt() {
            const config = getAdbConfig();
            const items = getItems();
            const total = calculateTotal();

            if (!config.host) { showResult(false, '請輸入 Sunmi IP'); return; }
            if (items.length === 0) { showResult(false, '請至少新增一項商品'); return; }

            const payload = {
                host: config.host,
                port: config.port,
                store_name: document.getElementById('store-name').value || '我的商店',
                items: items,
                total: total,
                note: document.getElementById('note').value
            };

            try {
                const res = await fetch('/pos/adb/print_receipt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                showResult(data.success, data.message);
            } catch (e) {
                showResult(false, '請求失敗：' + e.message);
            }
        }

        async function adbPrintText() {
            const config = getAdbConfig();
            const content = document.getElementById('text-content').value;

            if (!config.host) { showResult(false, '請輸入 Sunmi IP'); return; }
            if (!content.trim()) { showResult(false, '請輸入列印內容'); return; }

            try {
                const res = await fetch('/pos/adb/print_text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        host: config.host,
                        port: config.port,
                        content: content
                    })
                });
                const data = await res.json();
                showResult(data.success, data.message);
            } catch (e) {
                showResult(false, '請求失敗：' + e.message);
            }
        }

        // ============================================================
        // 佇列模式列印 (遠端提交到佇列，Sunmi 接收端自動印)
        // ============================================================
        async function queuePrintReceipt() {
            const items = getItems();
            const total = calculateTotal();

            if (items.length === 0) { showResult(false, '請至少新增一項商品'); return; }

            const payload = {
                type: 'receipt',
                store_name: document.getElementById('store-name').value || '我的商店',
                items: items,
                total: total,
                note: document.getElementById('note').value
            };

            try {
                const res = await fetch('/pos/queue/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                showResult(data.success, data.message);
                updateQueueCount();
            } catch (e) {
                showResult(false, '請求失敗：' + e.message);
            }
        }

        async function queuePrintText() {
            const content = document.getElementById('text-content').value;
            if (!content.trim()) { showResult(false, '請輸入列印內容'); return; }

            try {
                const res = await fetch('/pos/queue/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'text', content: content })
                });
                const data = await res.json();
                showResult(data.success, data.message);
                updateQueueCount();
            } catch (e) {
                showResult(false, '請求失敗：' + e.message);
            }
        }

        async function updateQueueCount() {
            try {
                const res = await fetch('/pos/queue/status');
                const data = await res.json();
                document.getElementById('queue-count').textContent = data.pending;
            } catch(e) {}
        }

        // ============================================================
        // 統一列印入口 (根據模式分流)
        // ============================================================
        function printReceipt() {
            const mode = getMode();
            if (mode === 'adb') { adbPrintReceipt(); }
            else if (mode === 'queue') { queuePrintReceipt(); }
            else if (mode === 'sunmi') { sunmiPrintReceipt(); }
            else { networkPrintReceipt(); }
        }

        function printText() {
            const mode = getMode();
            if (mode === 'adb') { adbPrintText(); }
            else if (mode === 'queue') { queuePrintText(); }
            else if (mode === 'sunmi') { sunmiPrintText(); }
            else { networkPrintText(); }
        }

        // ============================================================
        // 初始化
        // ============================================================
        (function init() {
            SunmiPrinter.detect();

            const detectEl = document.getElementById('sunmi-detect');
            if (SunmiPrinter.available) {
                detectEl.textContent = 'Sunmi JS Bridge 已偵測到！可以直接列印。';
                detectEl.className = 'status-ok';
            } else if (SunmiPrinter.isSunmiDevice) {
                detectEl.textContent = '偵測到 Sunmi 設備，但 JS Bridge 未啟用。請使用 Sunmi 內建瀏覽器開啟此頁面。';
                detectEl.className = 'status-warn';
            } else {
                detectEl.innerHTML = '目前不在 Sunmi 設備上。<br>請在 Sunmi POS 機的瀏覽器中開啟此頁面來使用 Sunmi 模式。<br>或切換到「網路印表機模式」。';
                detectEl.className = 'status-warn';
            }

            // 顯示接收端 URL
            const receiverUrl = window.location.origin + '/pos/sunmi';
            document.getElementById('receiver-url').textContent = receiverUrl;

            updatePreview();
            updateQueueCount();
            // 定時更新佇列數量
            setInterval(updateQueueCount, 5000);
        })();
    </script>
</body>
</html>
